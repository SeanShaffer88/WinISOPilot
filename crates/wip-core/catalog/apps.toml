# Provisioned (built-in) apps. `prefix` matches the start of the package's
# DisplayName as reported by Get-AppxProvisionedPackage, case-insensitively.
# Removing a provisioned app only affects user accounts created after setup.
# Framework packages (VCLibs, .NET Native, UI.Xaml, WindowsAppRuntime) are
# never offered: other apps depend on them.

[[option]]
id = "apps.clipchamp"
category = "apps"
title = "Clipchamp video editor"
summary = "Microsoft's online video editor."
details = "A web-backed video editor that asks you to sign in. Removing it does not affect the Photos app or video playback."
risk = "safe"
undo = "Install Clipchamp from the Microsoft Store."
applies = "win11"
actions = [{ kind = "remove_appx", prefix = "Clipchamp.Clipchamp" }]

