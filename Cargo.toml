[workspace]
resolver = "2"
members = ["crates/wip-core", "crates/wip-engine", "crates/winisopilot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sean Shaffer"]
repository = "https://github.com/SeanShaffer88/WinISOPilot"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
