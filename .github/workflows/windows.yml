name: Windows build and tests

on:
  pull_request:
  push:
    branches: [main, rust-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
          rustc --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Self-test (debug build has a console)
        run: cargo run --locked -p winisopilot -- --self-test
      - name: Release build
        run: cargo build --release --locked -p winisopilot
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: WinISOPilot-${{ github.sha }}
          path: |
            target/release/WinISOPilot.exe
            LICENSE
            README.md
          if-no-files-found: error
