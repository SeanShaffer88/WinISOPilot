name: Windows build and self-tests

on:
  pull_request:
  push:
    branches: [main, read-only-prototype]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified from official remote
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5, verified from official remote
        with:
          dotnet-version: 10.0.x
      - name: Build package-free Windows prototype
        run: dotnet build src/WinISOPilot/ImageGuide.csproj --configuration Release
      - name: Run deterministic self-tests
        run: dotnet run --project src/WinISOPilot/ImageGuide.csproj --configuration Release --no-build -- --self-test
      - name: Build native WPF desktop
        run: dotnet build src/WinISOPilot.Desktop/WinISOPilot.Desktop.csproj --configuration Release
      - name: Run WPF state and measured layout tests
        run: dotnet run --project src/WinISOPilot.Desktop/WinISOPilot.Desktop.csproj --configuration Release --no-build -- --self-test
