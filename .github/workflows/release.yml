name: Release

# Builds, tests and publishes a GitHub release when a v* tag is pushed, or
# when a release/v* branch is pushed (the tag is then created at that commit).

on:
  push:
    tags: ['v*']
    branches: ['release/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p winisopilot
      - name: Sign (only when a code-signing certificate is configured)
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) { Write-Host 'No SIGNING_PFX_BASE64 secret: the exe stays unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:SIGNING_PFX_PASSWORD target/release/WinISOPilot.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          Remove-Item $pfx
          & $signtool.FullName verify /pa target/release/WinISOPilot.exe
      - name: Package
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.Replace('release/', '').TrimStart('v')
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/WinISOPilot.exe "dist/WinISOPilot-$v-x64.exe"
          Copy-Item THIRD-PARTY-NOTICES.md dist/THIRD-PARTY-NOTICES.md
          Get-ChildItem dist/*.exe | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          $log = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($log, "(?s)## \[$([regex]::Escape($v))\].*?(?=\r?\n## \[|\z)").Value
          $head = ''
          if ($v.StartsWith('0.')) {
            $head = "**Pre-release.** Built and tested on CI; not yet verified end to end on real hardware (see AUDIT.md). Test results in a VM first.`n`nRequires Windows 10/11 x64, run as administrator. Windows ADK Deployment Tools recommended.`n`n"
          }
          $sums = Get-Content dist/SHA256SUMS.txt -Raw
          Set-Content -Encoding utf8 dist/notes.md ($head + $section + "`n`n### SHA-256`n``````n" + $sums + "``````n")
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ github.ref_name }}'.Replace('release/', '')
          $pre = @()
          if ($v.StartsWith('v0.')) { $pre += '--prerelease' }
          if ('${{ github.ref_type }}' -eq 'tag') { $pre += '--verify-tag' } else { $pre += @('--target', '${{ github.sha }}') }
          gh release create $v (Get-ChildItem dist/*.exe).FullName dist/SHA256SUMS.txt dist/THIRD-PARTY-NOTICES.md --title "WinISOPilot $v" --notes-file dist/notes.md @pre
