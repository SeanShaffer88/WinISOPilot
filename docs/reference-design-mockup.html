<!doctype html><html><head><meta charset="utf-8"><title>WinISOPilot • Reference design mockup</title><style>
*{box-sizing:border-box}body{margin:20px;background:#080a0d;color:#f0f5fa;font:15px "Segoe UI",sans-serif}main{--bg:#0e1116;--card:#151a22;--line:#596575;--text:#f0f5fa;--muted:#c0ccda;width:920px;height:660px;display:grid;grid-template:94px 1fr 65px/190px 1fr;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;overflow:hidden}main.light{--bg:#fff;--card:#eef1f5;--text:#172333;--muted:#465b70}header{grid-column:span 2;padding:12px 16px;border-bottom:1px solid var(--line)}header b{font-size:20px}header button{float:right}small{color:var(--muted)}nav{padding:6px 8px;display:grid;grid-template-rows:repeat(10,1fr);gap:3px;border-right:1px solid var(--line)}button,input,select{font:inherit}button{background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px;cursor:pointer}button:disabled{cursor:default;opacity:.65}nav button{text-align:left;white-space:normal}nav button.active{background:#be1831;color:white;border-color:#be1831}article{padding:12px 16px;overflow:auto}h2{margin:0 0 10px;font-size:20px}h3{font-size:16px;margin:8px 0}.card{border:1px solid var(--line);background:var(--card);padding:12px;border-radius:6px;margin:8px 0}.badge{font-size:13px;font-weight:bold;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .card{margin:0}input[type=search]{width:100%;padding:9px;margin:10px 0;background:var(--card);color:var(--text);border:1px solid var(--line)}input[type=checkbox]{accent-color:#be1831}p{line-height:1.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}footer{grid-column:span 2;border-top:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:8px}select{background:var(--bg);color:var(--text);padding:7px;border:1px solid var(--line)}.service{display:grid;grid-template-columns:1fr 150px;gap:10px;padding:6px 0}.note{margin-top:5px;line-height:1.4}</style></head><body><main id="shell"><header><button id="theme">Light theme</button><b>WinISOPilot</b><br><small>REFERENCE MOCKUP • original ISO untouched</small><div id="status" class="note"></div></header><nav id="nav"></nav><article id="body"></article><footer><button id="undo">Undo choices</button><button disabled>Pause</button><button disabled>Cancel safely</button><small>Mockup only. No files or Windows settings change.</small></footer></main><script>
const names=['Image & Indexes','Hardware & OOBE','Apps & Packages','System Components','Registry Settings','Services & Tasks','Drivers & Updates','Unattended Setup','Presets & Compare','Build & Export'];const options=[{"id": "tpm", "group": "Hardware", "name": "TPM check override", "detail": "Build-specific and unverified. May prevent supported installation."}, {"id": "secure-boot", "group": "Hardware", "name": "Secure Boot check override", "detail": "Does not enable Secure Boot or establish hardware support."}, {"id": "ram", "group": "Hardware", "name": "Memory check override", "detail": "Does not make low-memory devices reliable."}, {"id": "cpu", "group": "Hardware", "name": "Processor check override", "detail": "Build-specific; unsupported hardware remains unsupported."}, {"id": "storage", "group": "Hardware", "name": "Storage check override", "detail": "Does not create required disk space."}, {"id": "local-account", "group": "Hardware", "name": "Local account setup preference", "detail": "OOBE behavior varies by Windows build. Not implemented."}, {"id": "encryption", "group": "Hardware", "name": "Prevent automatic device encryption", "detail": "Would change a security default. No change runs here."}, {"id": "xbox", "group": "Apps", "name": "Xbox apps", "detail": "Actual package identities and dependencies have not been inventoried."}, {"id": "phone-link", "group": "Apps", "name": "Phone Link", "detail": "Removal is not implemented or assessed for this image."}, {"id": "copilot", "group": "Apps", "name": "Copilot", "detail": "Installed form varies by image and build."}, {"id": "clipchamp", "group": "Apps", "name": "Clipchamp", "detail": "No package footprint or removal safety has been measured."}, {"id": "news", "group": "Apps", "name": "News and Weather", "detail": "Dependencies and applicability are unknown."}, {"id": "solitaire", "group": "Apps", "name": "Solitaire", "detail": "No installed package inventory has run."}, {"id": "cleanup", "group": "Components", "name": "Superseded component cleanup", "detail": "Requires supported servicing and post-change verification."}, {"id": "resetbase", "group": "Components", "name": "ResetBase cleanup", "detail": "Would remove rollback for existing updates. Not reversible by selection Undo."}, {"id": "wordpad", "group": "Components", "name": "Legacy WordPad", "detail": "May already be absent on newer releases. Applicability unknown."}, {"id": "media-player", "group": "Components", "name": "Legacy Media Player", "detail": "Features and dependencies must be inventoried first."}, {"id": "ie-mode", "group": "Components", "name": "Internet Explorer compatibility components", "detail": "Could affect applications that depend on embedded web components."}, {"id": "winre", "group": "Components", "name": "Windows Recovery Environment", "detail": "Would remove recovery functionality. No removal runs here."}, {"id": "context-menu", "group": "Registry", "name": "Classic context menu preference", "detail": "Version-dependent shell behavior; not verified."}, {"id": "bing-search", "group": "Registry", "name": "Reduce web results in Start", "detail": "Policy support and edition applicability vary."}, {"id": "telemetry", "group": "Registry", "name": "Diagnostic-data preference", "detail": "A registry value does not guarantee zero diagnostic data on every edition."}, {"id": "extensions", "group": "Registry", "name": "Show file extensions and hidden files", "detail": "Preview wish only; no offline hive is loaded."}, {"id": "dark-theme", "group": "Registry", "name": "Dark Windows theme preference", "detail": "Does not change this app's independent theme toggle."}, {"id": "lock-ads", "group": "Registry", "name": "Reduce lock-screen suggestions", "detail": "Applicability is build-specific and not checked."}, {"id": "delivery", "group": "Registry", "name": "Delivery Optimization preference", "detail": "Does not disable Windows Update; no policy is applied."}, {"id": "this-pc", "group": "Registry", "name": "Open Explorer at This PC", "detail": "User-default behavior would need first-boot testing."}, {"id": "drivers", "group": "Integration", "name": "Stage INF driver packages", "detail": "No files selected, signature verification or image injection occurs."}, {"id": "updates", "group": "Integration", "name": "Stage CAB/MSU updates", "detail": "Prerequisite ordering and compatibility are not evaluated."}];const requests=new Set,services={},history=[];let page=0;const body=document.getElementById('body');function snapshot(){history.push(JSON.stringify({requests:[...requests],services:{...services}}))}function status(){document.getElementById('status').textContent='Source: not inspected • Edition: unknown • Activity: idle • Reclaimed: not measured • Preview: '+(requests.size+Object.values(services).filter(x=>x!=='Unchanged').length)+' requests'}function card(title,state,content){return '<section class="card"><span class="badge">'+state+'</span><h3>'+title+'</h3>'+content+'</section>'}function render(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===page));body.innerHTML='<h2>'+(page+1)+'. '+names[page]+'</h2><small>Preview choices never execute. Keep unchanged is the default.</small>';const group={1:'Hardware',2:'Apps',3:'Components',4:'Registry',6:'Integration'}[page];if(group){body.innerHTML+='<input type="search" placeholder="Filter preview choices" id="filter"><p id="matches"></p><div id="cards" class="'+([1,3].includes(page)?'grid':'')+'"></div>';const update=()=>{const list=options.filter(o=>o.group===group&&(o.name+' '+o.detail).toLowerCase().includes(document.getElementById('filter').value.toLowerCase()));document.getElementById('matches').textContent=list.length?list.length+' preview choices':'No preview choices match';document.getElementById('cards').innerHTML=list.map(o=>card(o.name,'PREVIEW • not implemented','<label><input type="checkbox" data-id="'+o.id+'" '+(requests.has(o.id)?'checked':'')+'> Request in preview</label><p>'+o.detail+'</p>')).join('');document.querySelectorAll('[data-id]').forEach(c=>c.onchange=()=>{snapshot();c.checked?requests.add(c.dataset.id):requests.delete(c.dataset.id);status()})};document.getElementById('filter').oninput=update;update()}else if(page===0){body.innerHTML+=card('Source image','AVAILABLE IN APP • read-only inspection','<p>No source has been selected in this mockup.</p><button disabled>Choose ISO…</button> <button disabled>Inspect ISO</button>')+card('Image indexes','UNKNOWN • no inspection','<p>No sample editions or mounted-image claims.</p>')+card('Mount readiness','UNAVAILABLE • no mount worker','<p>No writable WIM mounting, forced unmount or foreign cleanup.</p>')}else if(page===5){body.innerHTML+=card('Service startup wishes','PREVIEW • actual states and dependencies unknown',['DiagTrack','WerSvc','MapsBroker','RemoteRegistry','WbioSrvc','Spooler','SysMain'].map(s=>'<div class="service"><span>'+s+'</span><select data-service="'+s+'">'+['Unchanged','Automatic','Manual','Disabled'].map(x=>'<option '+((services[s]||'Unchanged')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>').join(''));document.querySelectorAll('[data-service]').forEach(c=>c.onchange=()=>{snapshot();services[c.dataset.service]=c.value;status()})}else if(page===7){body.innerHTML+=card('Unattended setup simulation','SIMULATION ONLY','<p>No XML, account, password, disk action, EULA consent or command is generated.</p><pre>'+JSON.stringify({requested:[...requests],services,executable:false},null,2)+'</pre>')}else if(page===8){body.innerHTML+=card('Preview recipe • JSON','NONEXECUTING DATA ONLY','<p>Compare current wishes with unchanged defaults. No size savings or installed inventory is inferred.</p><pre>'+JSON.stringify({SchemaVersion:1,Executable:false,Requested:[...requests],Services:services,Region:'Keep source region'},null,2)+'</pre>')}else{body.innerHTML+=card('Create a separate installation ISO','AVAILABLE IN APP AFTER INSPECTION','<button disabled>Create customized ISO…</button> <button disabled>Export future plan…</button><p>All editions remain. Preview wishes are never applied. Boot and installation require testing.</p>')+card('Measured job activity','NO JOB HAS RUN','<p>No simulated log or progress percentage.</p>')}status()}
names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{page=i;render()};nav.appendChild(b)});document.getElementById('theme').onclick=()=>{shell.classList.toggle('light');theme.textContent=shell.classList.contains('light')?'Dark theme':'Light theme'};document.getElementById('undo').onclick=()=>{if(!history.length)return;const previous=JSON.parse(history.pop());requests.clear();previous.requests.forEach(x=>requests.add(x));Object.keys(services).forEach(x=>delete services[x]);Object.assign(services,previous.services);render()};render();</script></body></html>
